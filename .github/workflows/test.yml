name: Run Tests

on:
  push:
    branches: [ master, master-v2 ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-0 libxcb-xinerama0 libgl1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint (ruff)
        run: |
          ruff check src/
          ruff format --check src/

      - name: Type check (mypy)
        run: mypy src/

      - name: Security scan (bandit)
        run: bandit -c pyproject.toml -r src/ --exclude src/drivebox/storage/file_service.py

      - name: Run tests
        run: pytest tests/unit/ -v
        env:
          QT_QPA_PLATFORM: offscreen
