name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: drivebox-linux
            executable: dist/drivebox
          - os: windows-latest
            artifact_name: drivebox-windows
            executable: dist/drivebox.exe
          - os: macos-latest
            artifact_name: drivebox-macos
            executable: dist/drivebox

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt

      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0 libxcb1 libx11-xcb1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xkb1 libxkbcommon-x11-0 \
            xvfb libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller pillow

      - name: Generate app icon
        shell: python
        run: |
          from pathlib import Path

          from PIL import Image

          src = Path("src/drivebox/resources/icons/tray_icon.png")
          build_dir = Path("build")
          build_dir.mkdir(exist_ok=True)
          img = Image.open(src).convert("RGBA")

          if "${{ runner.os }}" == "Windows":
              sizes = [(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)]
              img.save(build_dir / "icon.ico", format="ICO", sizes=sizes)
          elif "${{ runner.os }}" == "macOS":
              img.save(build_dir / "icon.icns", format="ICNS")

      - name: Build executable
        run: pyinstaller drivebox.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.executable }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          cp artifacts/drivebox-linux/drivebox drivebox-linux
          cp artifacts/drivebox-windows/drivebox.exe drivebox-windows.exe
          cp artifacts/drivebox-macos/drivebox drivebox-macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            drivebox-linux
            drivebox-windows.exe
            drivebox-macos
          generate_release_notes: true
