name: Run Tests

on:
  push:
    branches: [ master, master-v2 ]
  pull_request:
    branches: [ master ]

jobs:
  changelog-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a CHANGELOG entry for src/ changes
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed_files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed_files" | grep -q '^src/' && ! echo "$changed_files" | grep -q '^CHANGELOG.md$'; then
            echo "::error::This PR changes src/ but does not update CHANGELOG.md. Add an entry under [Unreleased] — see CONTRIBUTING.md."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-0 libxcb-xinerama0 libgl1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint (ruff)
        run: |
          ruff check src/
          ruff format --check src/

      - name: Type check (mypy)
        run: mypy src/

      - name: Security scan (bandit)
        run: bandit -c pyproject.toml -r src/ --exclude src/drivebox/storage/file_service.py

      - name: Run tests
        run: pytest tests/unit/ -v
        env:
          QT_QPA_PLATFORM: offscreen
